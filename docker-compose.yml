version: '3.8'

services:
  # ----------------------------------------------------
  # 1. Relational Database: MySQL 8.0
  # ----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: incident-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: incidentdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - incident-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------
  # 2. Spring Boot 3.2 Backend REST API & Gemini RAG
  # ----------------------------------------------------
  backend:
    build:
      context: ./incident-management
      dockerfile: Dockerfile
    container_name: incident-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/incidentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERVER_PORT: 8080
    networks:
      - incident-network

  # ----------------------------------------------------
  # 3. React 19 Frontend Web Application (Nginx)
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - incident-network

networks:
  incident-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
