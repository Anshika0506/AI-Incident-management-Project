spring.application.name=incident-management
server.port=${PORT:8080}

# Database Configuration (Defaults to local MySQL, overrides via env for Render / Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/incidentdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root123}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
